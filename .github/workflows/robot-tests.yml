name: Security Testing Automation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  robot-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Demarrage de l'application cible (OWASP Juice Shop via Docker)
        run: |
          docker run -d -p 3000:3000 --name juice-shop bkimminich/juice-shop
          echo "Attente du demarrage de Juice Shop..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Juice Shop est pret."
              break
            fi
            sleep 2
          done

      - name: Creation des comptes de test (utilisateur normal + admin via mass assignment)
        run: |
          curl -s -X POST http://localhost:3000/api/Users \
            -H "Content-Type: application/json" \
            -d '{"email":"testuser@example.com","password":"Test1234!"}'
          curl -s -X POST http://localhost:3000/api/Users \
            -H "Content-Type: application/json" \
            -d '{"email":"admin-test@example.com","password":"AdminTest123!","role":"admin"}'

      - name: Execution des tests Robot Framework
        run: |
          robot --outputdir reports --variable TIMEOUT:30s tests/ || true

      - name: Upload du rapport HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-framework-report
          path: reports/

      - name: Affichage du resume dans les logs
        if: always()
        run: cat reports/output.xml | head -50

  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Demarrage de Juice Shop
        run: |
          docker run -d -p 3000:3000 --name juice-shop bkimminich/juice-shop
          for i in $(seq 1 30); do
            curl -s http://localhost:3000 > /dev/null && break
            sleep 2
          done

      - name: Scan OWASP ZAP Baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000'
          cmd_options: '-a'
          allow_issue_writing: false
          fail_action: false

      - name: Upload du rapport ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Clonage de Juice Shop pour analyse des dependances
        run: git clone --depth 1 https://github.com/juice-shop/juice-shop.git

      - name: npm audit
        working-directory: ./juice-shop
        run: |
          npm audit --json > ../npm-audit-report.json || true
          npm audit || true

      - name: Upload du rapport npm audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json

  consolidate-reports:
    runs-on: ubuntu-latest
    needs: [robot-tests, zap-scan, dependency-scan]
    if: always()
    steps:
      - name: Telechargement de tous les rapports
        uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: Upload du rapport consolide
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-full-report
          path: all-reports/
