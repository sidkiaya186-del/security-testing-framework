name: Security Testing Automation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  robot-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Démarrage de l'application cible (OWASP Juice Shop via Docker)
        run: |
          docker run -d -p 3000:3000 --name juice-shop bkimminich/juice-shop
          echo "Attente du démarrage de Juice Shop..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Juice Shop est prêt."
              break
            fi
            sleep 2
          done

      - name: Création des comptes de test (utilisateur normal + admin via mass assignment)
        run: |
          curl -s -X POST http://localhost:3000/api/Users \
            -H "Content-Type: application/json" \
            -d '{"email":"testuser@example.com","password":"Test1234!"}'
          curl -s -X POST http://localhost:3000/api/Users \
            -H "Content-Type: application/json" \
            -d '{"email":"admin-test@example.com","password":"AdminTest123!","role":"admin"}'

      - name: Exécution des tests Robot Framework
        run: |
          robot --outputdir reports tests/

      - name: Upload du rapport HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-framework-report
          path: reports/

      - name: Affichage du résumé dans les logs
        if: always()
        run: cat reports/output.xml | head -50