name: Security Testing Automation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  robot-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: (Optionnel) Démarrage de l'application cible (DVWA via Docker)
        run: |
          docker run -d -p 8080:80 --name dvwa vulnerables/web-dvwa
          sleep 15

      - name: Exécution des tests Robot Framework
        run: |
          robot --outputdir reports tests/

      - name: Upload du rapport HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-framework-report
          path: reports/

      - name: Affichage du résumé dans les logs
        if: always()
        run: cat reports/output.xml | head -50
